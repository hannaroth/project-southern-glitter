# Runs the linter and the whole test suite against a throwaway Postgres on every
# pull request into main, and again after each merge. Hanna can make the "tests"
# check required for merging in the repo's branch protection settings.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for CI only; nothing here is a real secret.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DEBUG: "true"
      SECRET_KEY: ci-only-not-secret
      ALLOWED_HOSTS: localhost,testserver

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff==0.16.9

      - name: Lint (ruff, rules in ruff.toml)
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # Same step as build.sh on Render; the admin pages need the static manifest.
      - name: Collect static files
        run: python manage.py collectstatic --no-input

      - name: Run tests
        run: python manage.py test --verbosity 2
